<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- SAMPLE LOGO: replace with your real school logo (img/logo.png) -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff7ab6"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <radialGradient id="fill" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#2a1d5c"/>
      <stop offset="1" stop-color="#0b0820"/>
    </radialGradient>
    <path id="arcTop" d="M 44 120 A 76 76 0 0 1 196 120"/>
    <path id="arcBottom" d="M 52 120 A 68 68 0 0 0 188 120"/>
  </defs>

  <circle cx="120" cy="120" r="112" fill="url(#fill)" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Graduation cap -->
  <g transform="translate(120 112)">
    <path d="M -46 -8 L 0 -30 L 46 -8 L 0 14 Z" fill="#ffd166"/>
    <path d="M -28 2 L -28 22 C -28 34 28 34 28 22 L 28 2 L 0 15 Z" fill="#f4f1ff"/>
    <path d="M 40 -5 L 40 22" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="25" r="4.5" fill="#ffd166"/>
  </g>

  <text font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="5" fill="#f4f1ff">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">YOUR SCHOOL</textPath>
  </text>
  <text font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#a9a3c9">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">EST. 2026</textPath>
  </text>
</svg>
